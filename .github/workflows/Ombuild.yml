name: Build Lumen APK
on: [workflow_dispatch, push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Release APK
        working-directory: ./launcher
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: lumen-launcher-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1
          name: Lumen Launcher APK v3.1
          files: launcher/app/build/outputs/apk/release/app-release.apk
